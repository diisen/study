<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCEA Level 2 Exam Vocab Quest | 試験英単語＆論述クエスト</title>
  <meta name="description" content="New Zealand NCEA Year 12 (Level 2) interactive English vocabulary web app for decoding exam prompts and writing Achieved, Merit, and Excellence answers across Physics, Math, Psychology, and English.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body>

  <!-- Top Lab Header -->
  <header class="lab-header">
    <div class="logo-group">
      <a href="../index.html" class="back-hub-btn" title="Back to Learning Hub">
        <span>←</span> Hub
      </a>
      <span class="logo-badge">NCEA Y12</span>
      <h1 class="lab-title">Exam Vocab <span>Quest & Lexicon</span></h1>
    </div>
    <div class="header-meta">
      <span class="badge-tag">全科目共通・指示語＆4科目頻出語</span>
      <span class="badge-tag" style="background: rgba(16, 185, 129, 0.12); border-color: rgba(16, 185, 129, 0.35); color: #6ee7b7;">🔊 ネイティブ発音＆ゲーム搭載</span>
    </div>
  </header>

  <!-- Gamification Player HUD Bar -->
  <section class="player-hud-bar" id="playerHudBar">
    <!-- Rendered dynamically by app.js -->
  </section>

  <!-- Main Content Container -->
  <main class="main-container">

    <!-- Folder-Style Navigation Tabs (Pattern B: Connected to Main Sheet) -->
    <nav class="nav-tabs-wrapper">
      <button class="nav-tab-btn active" data-tab="tab-quest">
        <span class="tab-top-line"><span>🎮</span><span>Vocab Quest</span></span>
        <span class="tab-sub-line">問題文バトル＆60秒</span>
      </button>
      <button class="nav-tab-btn" data-tab="tab-flashcards">
        <span class="tab-top-line"><span>🃏</span><span>Smart Cards</span></span>
        <span class="tab-sub-line">習熟度カード＆発音</span>
      </button>
      <button class="nav-tab-btn" data-tab="tab-command">
        <span class="tab-top-line"><span>🧭</span><span>Command Words</span></span>
        <span class="tab-sub-line">試験指示語＆回答の型</span>
      </button>
      <button class="nav-tab-btn" data-tab="tab-dictionary">
        <span class="tab-top-line"><span>📚</span><span>Word Bank</span></span>
        <span class="tab-sub-line">全76語検索＆罠リスト</span>
      </button>
      <button class="nav-tab-btn" data-tab="tab-badges">
        <span class="tab-top-line"><span>🏆</span><span>Badges & Stats</span></span>
        <span class="tab-sub-line">称号・学習記録</span>
      </button>
    </nav>

    <!-- TAB 1: QUEST & ARCADE ARENA -->
    <section id="tab-quest" class="tab-panel active">
      <div id="questArenaContainer"></div>
    </section>

    <!-- TAB 2: SMART FLASHCARDS & SRS -->
    <section id="tab-flashcards" class="tab-panel">
      <div id="flashcardsContainer"></div>
    </section>

    <!-- TAB 3: NCEA COMMAND WORDS & ANSWER BUILDER -->
    <section id="tab-command" class="tab-panel">
      <div id="commandMatrixContainer"></div>
    </section>

    <!-- TAB 4: FULL WORD BANK & SEARCH -->
    <section id="tab-dictionary" class="tab-panel">
      <div id="dictionaryContainer"></div>
    </section>

    <!-- TAB 5: PLAYER BADGES & STATS -->
    <section id="tab-badges" class="tab-panel">
      <div id="badgesContainer"></div>
    </section>

  </main>

  <footer class="lab-footer">
    NCEA Level 2 (Year 12) Exam Vocab Quest • Command Words, Essay Connectors, Physics, Math, Psychology & English
  </footer>

  <script src="js/vocabData.js"></script>
  <script src="js/app.js"></script>
  <script src="../tools/layout-audit.js" defer></script>
</body>
</html>
